version: "3"

tasks:
  setup:
    desc: Install the pinned tools (not the Swift toolchain, see AGENTS.md)
    cmds:
      - mise trust
      - mise install

  build:
    desc: Build every target (RouterCore, RouterCoreAudio, AudioRouterApp, audio-router-proto)
    cmds:
      - swift build

  test:
    desc: Unit tests, no audio hardware needed
    cmds:
      - swift test

  bundle:
    desc: Build dist/audio-router.app (arm64 release, ad hoc signed). VERSION overrides the git describe version.
    cmds:
      - scripts/bundle.sh

  bundle:zip:
    desc: Zip dist/audio-router.app to dist/audio-router-<version>-arm64.zip with ditto. Run after bundle.
    cmds:
      - |
        set -euo pipefail
        version="$(plutil -extract CFBundleShortVersionString raw dist/audio-router.app/Contents/Info.plist)"
        [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "invalid version ${version}" >&2; exit 1; }
        zip="dist/audio-router-${version}-arm64.zip"
        rm -f "${zip}"
        # --norsrc and --noextattr keep AppleDouble ._ entries out of the zip. They would break the seal after unzip.
        ditto -c -k --norsrc --noextattr --keepParent dist/audio-router.app "${zip}"
        listing="$(unzip -Z1 "${zip}")"
        if grep -qE 'audio-router-proto' <<<"${listing}"; then
          echo "the zip must not contain audio-router-proto" >&2
          exit 1
        fi
        if grep -qE '(^|/)\._|__MACOSX' <<<"${listing}"; then
          echo "the zip must not contain AppleDouble or __MACOSX entries" >&2
          exit 1
        fi
        echo "${zip}"

  bundle:verify:
    desc: Check dist/audio-router.app (plist keys, signature, runtime, no sandbox, arm64 only, no prototype). Run after bundle.
    cmds:
      - |
        set -euo pipefail
        app=dist/audio-router.app
        plist="${app}/Contents/Info.plist"
        fail() { echo "$1" >&2; exit 1; }
        plutil -lint "${plist}"
        codesign --verify --deep --strict "${app}"
        # Hardened runtime on, and no entitlements at all, so no sandbox entitlement.
        info="$(codesign -dv "${app}" 2>&1)"
        [[ "${info}" == *"flags="*runtime* ]] || fail "the signature has no hardened runtime flag"
        ents="$(codesign -d --entitlements - "${app}" 2>/dev/null || true)"
        [ -z "${ents}" ] || fail "the signature carries entitlements"
        [ "$(plutil -extract LSUIElement raw "${plist}")" = "true" ] || fail "LSUIElement is not true"
        [ "$(plutil -extract LSMinimumSystemVersion raw "${plist}")" = "14.2" ] || fail "LSMinimumSystemVersion is not 14.2"
        usage="$(plutil -extract NSAudioCaptureUsageDescription raw "${plist}")"
        [ -n "${usage}" ] || fail "NSAudioCaptureUsageDescription is empty"
        exe="$(plutil -extract CFBundleExecutable raw "${plist}")"
        [ -f "${app}/Contents/Resources/AppIcon.icns" ] || fail "AppIcon.icns is missing"
        files="$(find "${app}/Contents/MacOS" -type f)"
        [ "${files}" = "${app}/Contents/MacOS/${exe}" ] || fail "Contents/MacOS must hold only ${exe}"
        # Finds the name anywhere in the bundle. A renamed copy of the prototype is not covered.
        found="$(find "${app}" -name '*audio-router-proto*')"
        [ -z "${found}" ] || fail "audio-router-proto is in the bundle: ${found}"
        archs="$(lipo -archs "${app}/Contents/MacOS/${exe}")"
        echo "archs: ${archs}"
        [ "${archs}" = "arm64" ] || fail "expected only arm64"

  lint:fmt:
    desc: Swift format check, part of the Swift toolchain
    cmds:
      - swift format lint --strict --recursive Package.swift Sources Tests

  lint:license:
    desc: License header check for every Swift file
    cmds:
      - |
        addlicense -check -c "Simon Ostendorf" -y 2026 -l apache -s=only \
          $(find . -name "*.swift" -not -path "./.build/*" -not -path "./.claude/worktrees/*")

  lint:core-imports:
    desc: RouterCore imports only Foundation and Darwin (CoreImportTests checks the same)
    # A simple line check. It drops `//` comments and splits on `;`. It does not know block
    # comments or string literals, so an import spelled inside them is reported too. That fails
    # closed: the Swift test CoreImportTests is the exact check.
    cmds:
      - |
        test -d Sources/RouterCore || { echo "Sources/RouterCore is missing" >&2; exit 1; }
        find Sources/RouterCore -name '*.swift' -print | grep -q . || { echo "no Swift file in Sources/RouterCore" >&2; exit 1; }
        find Sources/RouterCore -name '*.swift' -exec awk '
          BEGIN { allowed["Foundation"]; allowed["Darwin"]; bad = 0 }
          {
            line = $0
            sub(/\/\/.*/, "", line)
            count = split(line, parts, ";")
            for (i = 1; i <= count; i++) {
              n = split(parts[i], w, /[[:space:]]+/)
              k = 1
              while (k <= n && (w[k] == "" || w[k] ~ /^@/)) k++
              if (w[k] ~ /^(public|package|internal|fileprivate|private|open)$/) k++
              if (w[k] != "import") continue
              k++
              if (w[k] ~ /^(struct|class|enum|protocol|typealias|func|let|var)$/ && k < n) k++
              module = w[k]
              sub(/\..*/, "", module)
              if (!(module in allowed)) { print FILENAME ":" FNR ": import " module; bad = 1 }
            }
          }
          END { exit bad }
        ' {} + || { echo "RouterCore may import only Foundation and Darwin" >&2; exit 1; }

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  check:
    desc: Everything CI runs
    cmds:
      - task: lint:fmt
      - task: lint:license
      - task: lint:core-imports
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: build
      - task: test
