version: "3"

tasks:
  setup:
    desc: Install the pinned tools (not the Swift toolchain, see AGENTS.md)
    cmds:
      - mise trust
      - mise install

  build:
    desc: Build every target (RouterCore, RouterCoreAudio, AudioRouterApp, audio-router-proto)
    cmds:
      - swift build

  test:
    desc: Unit tests, no audio hardware needed
    cmds:
      - swift test

  lint:fmt:
    desc: Swift format check, part of the Swift toolchain
    cmds:
      - swift format lint --strict --recursive Package.swift Sources Tests

  lint:license:
    desc: License header check for every Swift file
    cmds:
      - |
        addlicense -check -c "Simon Ostendorf" -y 2026 -l apache -s=only \
          $(find . -name "*.swift" -not -path "./.build/*" -not -path "./.claude/worktrees/*")

  lint:core-imports:
    desc: RouterCore imports no Core Audio, audio or UI framework (CoreImportTests checks the same)
    cmds:
      - |
        attributes='^[[:space:]]*(@[A-Za-z]+[[:space:]]+)*((public|package|internal|fileprivate|private)[[:space:]]+)?'
        kind='((struct|class|enum|protocol|typealias|func|let|var)[[:space:]]+)?'
        modules='(CoreAudio|AudioToolbox|AVFoundation|AppKit)([.[:space:]]|$)'
        if grep -rnE "${attributes}import[[:space:]]+${kind}${modules}" Sources/RouterCore; then
          echo "RouterCore must not import CoreAudio, AudioToolbox, AVFoundation or AppKit" >&2
          exit 1
        fi

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  check:
    desc: Everything CI runs
    cmds:
      - task: lint:fmt
      - task: lint:license
      - task: lint:core-imports
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: build
      - task: test
