name: spike-audiodevicestart

# Throwaway spike for issue 86. Never merge to main, delete it with the branch.
# One run tests one variant, picked by the input. Read the answer from the log lines SPIKE[...].
# No secrets. The run changes the runner only, which is thrown away after the run.
#
# Variants:
#   baseline         BlackHole installed, coreaudiod restarted, default output BlackHole 2ch, route to BlackHole 2ch
#   default-avsd     as baseline, but the default output stays on Apple Virtual Sound Device
#   null-device      as baseline, but the route goes to the Null Audio Device
#   clean-null       no driver, no coreaudiod restart, default output untouched, route to the Null Audio Device
# The source in every variant is .github/spike/tone.swift, a small app bundle that plays without an Apple Event.
# Every route start runs under a hard timeout, so a hung AudioDeviceStart costs ROUTE_TIMEOUT seconds, not 3 minutes.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: The one variant this run tests
        type: choice
        required: true
        default: baseline
        options:
          - baseline
          - default-avsd
          - null-device
          - clean-null

permissions:
  contents: read

env:
  VARIANT: ${{ inputs.variant }}
  ROUTE_TIMEOUT: "45"
  TONE_ID: cloud.ostendorf.spike-tone

jobs:
  probe:
    # The image the release workflow (app-release.yaml, job bundle) uses.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Runner facts
        run: |
          echo "SPIKE[facts] variant: ${VARIANT}"
          sw_vers
          uname -m
          echo "csrutil: $(csrutil status 2>&1)"
          echo "console user: $(stat -f %Su /dev/console)"

      - name: Build the tool
        run: swift build -c release --product audio-router-proto

      - name: Build the tone source
        run: |
          APP="$RUNNER_TEMP/tone.app"
          mkdir -p "$APP/Contents/MacOS"
          swiftc -swift-version 5 -O .github/spike/tone.swift -o "$APP/Contents/MacOS/tone"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>${TONE_ID}</string>
            <key>CFBundleName</key><string>tone</string>
            <key>CFBundleExecutable</key><string>tone</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          echo "TONE_APP=$APP" >> "$GITHUB_ENV"

      - name: Devices before any change
        run: |
          system_profiler SPAudioDataType || true
          .build/release/audio-router-proto devices
          brew install switchaudio-osx
          echo "default output: $(SwitchAudioSource -c -t output)"

      - name: Install the driver and restart coreaudiod
        # clean-null skips the whole step: no install and no coreaudiod restart.
        if: inputs.variant != 'clean-null'
        run: |
          echo "SPIKE[driver] start"
          brew install --cask blackhole-2ch
          sleep 5
          sudo killall coreaudiod || true
          sleep 5
          .build/release/audio-router-proto devices
          echo "SPIKE[driver] done at $(date -u +%H:%M:%S)"

      - name: Switch the default output to BlackHole
        # Only baseline and null-device switch. default-avsd and clean-null keep Apple Virtual Sound Device.
        if: inputs.variant == 'baseline' || inputs.variant == 'null-device'
        run: |
          SwitchAudioSource -s "BlackHole 2ch" -t output
          echo "default output: $(SwitchAudioSource -c -t output)"

      - name: Start the tone source
        run: |
          echo "SPIKE[tone] default output: $(SwitchAudioSource -c -t output)"
          "$TONE_APP/Contents/MacOS/tone" 600 > tone.log 2>&1 &
          echo "TONE_PID=$!" >> "$GITHUB_ENV"
          sleep 5
          cat tone.log
          echo "-- processes the tool sees"
          .build/release/audio-router-proto apps
          if .build/release/audio-router-proto apps | grep -q "${TONE_ID}"; then
            echo "SPIKE[tone] RESULT: the tool lists ${TONE_ID}"
          else
            echo "SPIKE[tone] RESULT: the tool does not list ${TONE_ID}, the route below will fail to find it"
          fi

      - name: Route under a hard timeout
        run: |
          case "${VARIANT}" in
            baseline | default-avsd) DEST_NAME="BlackHole 2ch" ;;
            null-device | clean-null) DEST_NAME="Null Audio Device" ;;
            *) echo "unknown variant ${VARIANT}"; exit 1 ;;
          esac
          DEST_UID="$(.build/release/audio-router-proto devices | grep -F "${DEST_NAME}" | head -1 | awk '{print $1}')"
          echo "SPIKE[route] variant ${VARIANT}, destination ${DEST_NAME}, uid ${DEST_UID:-none}"
          if [ -z "${DEST_UID}" ]; then
            echo "SPIKE[route] RESULT: destination not listed, route not tried"
            exit 0
          fi
          START="$(date +%s)"
          echo "SPIKE[route] start at $(date -u +%H:%M:%S)"
          .build/release/audio-router-proto route --bundle-id "${TONE_ID}" \
            --device "${DEST_UID}" --channels 1,2 --meter > route.log 2>&1 &
          RPID=$!
          OUTCOME=timeout
          while [ $(( $(date +%s) - START )) -lt "${ROUTE_TIMEOUT}" ]; do
            if grep -q "meter: tap peak" route.log; then OUTCOME=meter; break; fi
            if ! kill -0 "${RPID}" 2>/dev/null; then OUTCOME=exited; break; fi
            sleep 1
          done
          echo "SPIKE[route] outcome ${OUTCOME} after $(( $(date +%s) - START )) s"
          if [ "${OUTCOME}" = meter ]; then sleep 10; fi
          # The start cannot be cancelled, so a TERM may wait for it. KILL after a short grace period.
          if kill -0 "${RPID}" 2>/dev/null; then
            kill -TERM "${RPID}" 2>/dev/null || true
            for _ in 1 2 3 4 5; do
              kill -0 "${RPID}" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "${RPID}" 2>/dev/null; then
              echo "SPIKE[route] still alive after TERM, sending KILL"
              kill -KILL "${RPID}" 2>/dev/null || true
            fi
          fi
          echo "-- route log"
          cat route.log
          echo "SPIKE[route] RESULT: ${OUTCOME}"

      - name: Logs for the evidence
        if: always()
        continue-on-error: true
        run: |
          echo "-- tone log"
          cat tone.log || true
          echo "-- default output: $(SwitchAudioSource -c -t output || true)"
          echo "-- TCC and coreaudiod log of the last 15 minutes"
          sudo log show --last 15m --style compact \
            --predicate 'subsystem == "com.apple.TCC" OR process == "coreaudiod" OR process == "tccd"' | tail -n 300 || true
          echo "-- TCC rows for audio"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service, client, auth_value from access where service like '%Audio%';" || true
