name: renovate

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  # Renovate runs when the checks of a Renovate branch have finished. The
  # list names every workflow that runs checks on a pull request: a
  # workflow left out can leave a pending check, and Renovate then waits
  # for the next scheduled tick.
  workflow_run:
    workflows: [checks, codeql, dco]
    types: [completed]
    branches: ["renovate/**"]

permissions:
  contents: read

jobs:
  renovate:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate.yaml@4fe971e06c1856e73ff0bf4572671f155af826d8  # v0.9.0
    secrets: inherit
