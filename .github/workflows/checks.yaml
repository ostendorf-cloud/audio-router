name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Core Audio only exists on macOS, so the Swift jobs run on a macOS runner with the Swift
  # toolchain that ships with its Xcode. The pinned mise tools run on Linux.
  fmt:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift format lint --strict --recursive Package.swift Sources Tests

  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift build

  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift test

  # Builds the arm64 release bundle with ad hoc signing and verifies it. Never sees a signing secret,
  # so a pull request from a fork builds the same way. Needs only task, the
  # Swift toolchain and the macOS tools of the runner. Not part of task check: a release build
  # is slow.
  bundle:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task
      - run: task --trusted-hosts github.com bundle bundle:verify bundle:zip

  # The tests of the signing scripts, with fake codesign, security, spctl and xcrun. No certificate,
  # no network, no secrets. macOS, so base64 --decode and plutil are the ones the release job uses.
  signing:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task
      - run: task --trusted-hosts github.com test:signing

  # The CI runners build with Xcode, which has the SwiftUI macro plugins. This check keeps the
  # sources buildable with the Command Line Tools alone. It needs bash, awk and find only.
  swiftui-macros:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task
      - run: task --trusted-hosts github.com lint:swiftui-macros

  # The tests of the cask scripts, with a fake gh and a fake brew. No network, no secrets.
  cask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task
      - run: task --trusted-hosts github.com test:cask

  # Runs brew audit --cask --strict and brew style on a rendered cask in a scratch tap, so a cask
  # the tap's audit would reject fails here instead of after a release. Homebrew comes with the
  # macOS runner image. No secrets, and the scratch tap is removed at the end of the script.
  cask-audit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task
      - run: task --trusted-hosts github.com lint:cask-audit

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task --trusted-hosts github.com lint:markdown

  agents-md:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task --trusted-hosts github.com lint:agents-md

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task --trusted-hosts github.com lint:yaml

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task --trusted-hosts github.com lint:actions

  # Validates renovate.json with the shared reusable workflow.
  renovate-config:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate-config.yaml@70490f7a4844b2f27ddee5469759aff1a3e3d57e  # v0.8.0

  # The shared reusable workflow pins addlicense itself and takes the file set as complete
  # "find" invocations, one per line. task lint:license keeps the same invocation for local
  # development, and AGENTS.md records that the two are kept in step by hand.
  license:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-license.yaml@70490f7a4844b2f27ddee5469759aff1a3e3d57e  # v0.8.0
    with:
      copyright-holder: Simon Ostendorf
      year: "2026"
      find-commands: |
        find . -name "*.swift" -not -path "./.build/*" -not -path "./.claude/worktrees/*"
