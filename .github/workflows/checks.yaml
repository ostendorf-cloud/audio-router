name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Core Audio only exists on macOS, so the Swift jobs run on a macOS runner with the Swift
  # toolchain that ships with its Xcode. The pinned mise tools run on Linux.
  fmt:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift format lint --strict --recursive Package.swift Sources Tests

  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift build

  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: swift test

  # Builds the arm64 release bundle with ad hoc signing and verifies it. Needs only task, the
  # Swift toolchain and the macOS tools of the runner. Not part of task check: a release build
  # is slow.
  bundle:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task
      - run: task bundle bundle:verify bundle:zip

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:markdown

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:yaml

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
      - run: task lint:actions

  # Validates renovate.json with the shared reusable workflow.
  renovate-config:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate-config.yaml@d285b23ec828534e965da429c46839c36437dd96  # v0.7.0

  # The shared reusable workflow pins addlicense itself and takes the file set as complete
  # "find" invocations, one per line. task lint:license keeps the same invocation for local
  # development, and AGENTS.md records that the two are kept in step by hand.
  license:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-license.yaml@d285b23ec828534e965da429c46839c36437dd96  # v0.7.0
    with:
      copyright-holder: Simon Ostendorf
      year: "2026"
      find-commands: |
        find . -name "*.swift" -not -path "./.build/*" -not -path "./.claude/worktrees/*"
