name: app-release

# Builds the app bundle and attaches an arm64 zip and its SHA-256 file to a GitHub release.
#
# Signing: ad hoc only. There is no Developer ID Application certificate and no notarisation.
# This is a known blocker, not a choice. Notarisation needs a Developer ID Application certificate
# from the paid Apple Developer Program, plus an App Store Connect API key or an app specific
# password as secrets set through the infrastructure repository. Then the job would run
# `notarytool submit --wait` and `stapler staple`. Until then each release triggers a new
# permission prompt and Gatekeeper blocks the first open. The README says so.
# The bundle job uses no secret. The homebrew job mints a token for the tap from the release app.
#
# The build is `task bundle`, `task bundle:verify` and `task bundle:zip` (scripts/bundle.sh and Taskfile.yaml).
# A runner has no usable audio device, so the job builds and verifies only.
#
# Uploading to an already published release fails when GitHub's immutable releases setting is on
# for this repository. The owner confirms that setting, see the pull request that added this file.
#
# A dry run: start this workflow by hand (workflow_dispatch) on a branch with an empty cask-tag.
# It builds and uploads the two files as a workflow artifact and does not touch any release.
#
# After the upload, the homebrew job pushes Casks/audio-router.rb to ostendorf-cloud/homebrew-tap,
# see scripts/publish-homebrew-cask.sh. A manual run from the default branch with cask-tag set
# skips the build and pushes the cask of that published release again.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      cask-tag:
        description: Published release tag to push the cask for, such as v0.1.0, from the default branch only. Empty runs the dry run build.
        required: false
        default: ""
        type: string
      allow-downgrade:
        description: Let a tag older than the tap's cask replace it
        required: false
        default: false
        type: boolean

permissions: {}

# A release run (ref: the tag) and a manual cask run (ref: main) are in different groups and can
# overlap. The PUT carries the sha of the file it replaces and the downgrade guard refuses an older
# version, so an overlap ends in a red run, never in a wrong cask.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    # A manual run with a cask-tag only pushes the cask, see the homebrew job.
    if: github.event_name == 'release' || inputs.cask-tag == ''
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # The sha256 of the zip this job built and uploaded, for the homebrew job.
    outputs:
      zip-sha256: ${{ steps.asset.outputs.sha256 }}
    env:
      # Every event value reaches a script through env, never inline in a `run:`.
      # Empty on a dry run, where the version comes from git describe.
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          # A dry run needs the tags for git describe.
          fetch-depth: 0
          persist-credentials: false

      # This job holds a write token. It installs only task, not all of mise.toml.
      # The Swift toolchain and the macOS tools come from the runner image.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          install_args: task

      - name: Validate the release tag
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "unexpected tag: ${RELEASE_TAG}" >&2; exit 1; }

      # VERSION is set on a release only. On a dry run the branch name would fail the version check.
      - name: Build, verify and zip the app bundle
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            VERSION="${RELEASE_TAG#v}"
            export VERSION
          fi
          task bundle
          task bundle:verify
          task bundle:zip

      - name: Write the checksum
        id: asset
        run: |
          set -euo pipefail
          zips=(dist/audio-router-*-arm64.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo "expected exactly one zip in dist/, found: ${zips[*]}" >&2
            exit 1
          fi
          zip="$(basename "${zips[0]}")"
          if [ -n "${RELEASE_TAG}" ] && [ "${zip}" != "audio-router-${RELEASE_TAG#v}-arm64.zip" ]; then
            echo "zip name ${zip} does not match tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          # A relative file name, so that shasum -c works in the folder with both files.
          (cd dist && shasum -a 256 "${zip}" > "${zip}.sha256")
          cat "dist/${zip}.sha256"
          echo "zip=${zip}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(cut -d' ' -f1 "dist/${zip}.sha256")" >> "${GITHUB_OUTPUT}"

      - name: Upload to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.asset.outputs.zip }}
        run: gh release upload "${RELEASE_TAG}" "dist/${ZIP}" "dist/${ZIP}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Upload as a workflow artifact on a dry run
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: audio-router-arm64
          path: |
            dist/${{ steps.asset.outputs.zip }}
            dist/${{ steps.asset.outputs.zip }}.sha256
          if-no-files-found: error

  # A manual run with cask-tag pushes from the default branch only. On another branch the bundle
  # and homebrew jobs both skip, so this job fails the run instead of leaving it green.
  cask-tag-branch:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.cask-tag != '' &&
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse a cask push from another branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "cask-tag pushes the cask from ${DEFAULT_BRANCH} only, this run is on ${REF}: start it again on ${DEFAULT_BRANCH}" >&2
          exit 1

  # Pushes the Homebrew cask to the tap, after the bundle job attached the zip its URL points at.
  # Its own job, so a failed push shows as a red run and "Re-run failed jobs" repeats this job
  # alone, with the bundle job's outputs kept. The cask is rendered from the zip downloaded from the
  # release and verified against the hash the bundle job recorded and against the release's .sha256
  # file (scripts/publish-homebrew-cask.sh). A manual run (workflow_dispatch with cask-tag, default
  # branch only) skips the bundle job and verifies against the .sha256 file alone. A pre-release
  # is skipped, an identical cask is left alone. Modelled on gitcd's homebrew job.
  homebrew:
    needs: bundle
    # always() lets a manual run start while the bundle job is skipped.
    if: >-
      always() && (
      (github.event_name == 'release' && needs.bundle.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.cask-tag != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Scoped to the tap alone and to contents: write, the one permission a file commit needs.
      # Minted here, in the one job that needs it, and revoked when the job ends.
      - name: Mint a token for the tap
        id: tap-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          app-id: ${{ vars.GH_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Push the cask to the tap
        env:
          # Reads this repository's published release, nothing else.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.cask-tag || github.event.release.tag_name }}
          ZIP_SHA256: ${{ needs.bundle.outputs.zip-sha256 }}
          VERIFY_MODE: ${{ github.event_name == 'workflow_dispatch' && 'checksums' || 'hash' }}
          ALLOW_DOWNGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow-downgrade || 'false' }}
        run: ./scripts/publish-homebrew-cask.sh
