name: spike-runner

# Throwaway spike for issue 60. Never merge to main, delete it with the branch.
# Every probe step has continue-on-error and prints markers: SPIKE[<id>] start, then
# SPIKE[<id>] RESULT: <what was seen>. Read the answers from the log of the run.
# No secrets. The probes change the runner only, which is thrown away after the run.

on:
  push:
    branches: [test/60-runner-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # The image the release workflow (app-release.yaml, job bundle) uses.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Q0 runner facts
        continue-on-error: true
        run: |
          echo "SPIKE[q0] start"
          sw_vers
          uname -m
          id
          echo "csrutil: $(csrutil status 2>&1)"
          echo "sudo without password: $(sudo -n true 2>&1 && echo yes || echo no)"
          echo "console user: $(stat -f %Su /dev/console)"
          echo "SPIKE[q0] RESULT: see lines above"

      - name: Build the tool
        run: swift build -c release --product audio-router-proto

      - name: Q5 audio devices present before any install
        continue-on-error: true
        run: |
          echo "SPIKE[q5] start"
          system_profiler SPAudioDataType || true
          .build/release/audio-router-proto devices || true
          echo "SPIKE[q5] RESULT: devices listed above, none means no audio hardware"

      - name: Q1 install a virtual device
        continue-on-error: true
        run: |
          echo "SPIKE[q1] start"
          brew info --cask blackhole-2ch || true
          brew install --cask blackhole-2ch
          sleep 5
          sudo killall coreaudiod || true
          sleep 5
          .build/release/audio-router-proto devices
          if .build/release/audio-router-proto devices | grep -qi blackhole; then
            echo "SPIKE[q1] RESULT: yes, the virtual device is listed"
          else
            echo "SPIKE[q1] RESULT: no, the virtual device is not listed"
          fi

      - name: Q4 switch the default output
        continue-on-error: true
        run: |
          echo "SPIKE[q4] start"
          brew install switchaudio-osx
          SwitchAudioSource -a -t output
          echo "default before: $(SwitchAudioSource -c -t output)"
          SwitchAudioSource -s "BlackHole 2ch" -t output
          echo "default after: $(SwitchAudioSource -c -t output)"
          if [ "$(SwitchAudioSource -c -t output)" = "BlackHole 2ch" ]; then
            echo "SPIKE[q4] RESULT: yes, the default output was switched by a script"
          else
            echo "SPIKE[q4] RESULT: no, the default output did not change"
          fi

      - name: Q2 grant the capture permission without a prompt
        continue-on-error: true
        run: |
          echo "SPIKE[q2] start"
          echo "SIP: $(csrutil status 2>&1)"
          ls -l "$HOME/Library/Application Support/com.apple.TCC/TCC.db" || true
          ls -l "/Library/Application Support/com.apple.TCC/TCC.db" || true
          echo "-- user db read"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service, client, auth_value from access;" || echo "user db read failed"
          echo "-- system db read"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service, client, auth_value from access;" || echo "system db read failed"
          echo "-- write attempt for the audio capture service (service name is a guess, not verified)"
          COLS="service, client, client_type, auth_value, auth_reason, auth_version"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "insert or replace into access (${COLS}) values ('kTCCServiceAudioCapture', '/bin/bash', 1, 2, 4, 1);" \
            && echo "write ok" || echo "write failed"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select service, client, auth_value from access where service like '%Audio%';" || true
          echo "SPIKE[q2] RESULT: read the write attempt and the select above, the grant counts only if Q3 gets samples"

      - name: Q3 play a tone and tap it
        continue-on-error: true
        run: |
          echo "SPIKE[q3] start"
          python3 - <<'PY'
          import math, struct, wave
          w = wave.open("sine.wav", "wb")
          w.setnchannels(2)
          w.setsampwidth(2)
          w.setframerate(48000)
          frames = bytearray()
          for i in range(48000 * 60):
              s = int(32767 * 0.5 * math.sin(2 * math.pi * 1000 * i / 48000))
              frames += struct.pack("<hh", s, s)
          w.writeframes(bytes(frames))
          w.close()
          PY
          ls -l sine.wav
          # Q6 can an app play a known tone: afplay is a command line tool, QuickTime Player is the app of the checklist.
          afplay sine.wav &
          APLAY=$!
          open -a "QuickTime Player" sine.wav || echo "open QuickTime Player failed"
          osascript -e 'tell application "QuickTime Player" to play document 1' || echo "osascript play failed"
          sleep 5
          echo "-- processes the tool sees"
          .build/release/audio-router-proto apps || true
          UID_OUT="$(.build/release/audio-router-proto devices | grep -i blackhole | head -1 | awk '{print $1}')"
          echo "device uid: ${UID_OUT:-none}"
          if [ -n "${UID_OUT}" ]; then
            .build/release/audio-router-proto route --bundle-id com.apple.QuickTimePlayerX \
              --device "${UID_OUT}" --channels 1,2 --meter > route.log 2>&1 &
            RPID=$!
            sleep 20
            kill -TERM "${RPID}" 2>/dev/null || true
            wait "${RPID}" 2>/dev/null || true
            echo "-- route log"
            cat route.log
            if grep -q "tap peak" route.log; then
              echo "SPIKE[q3] RESULT: meter lines present, check the tap peak value in the route log"
            else
              echo "SPIKE[q3] RESULT: no meter line, the tap delivered nothing or the route failed, see the route log"
            fi
          else
            echo "SPIKE[q3] RESULT: no virtual device, route not tried"
          fi
          kill "${APLAY}" 2>/dev/null || true
